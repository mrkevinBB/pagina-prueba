<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>La Tiendita del Barrio - Sistema POS</title>
  
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Google Fonts: Poppins & Playfair Display -->
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      --bg-color: #fdfbf7;
      --primary-color: #d9534f;
      --primary-hover: #c9302c;
      --accent-color: #f0ad4e;
      --brand-green: #2e7d32;
      --brand-green-light: #e8f5e9;
      --warm-dark: #2c221e;
      --card-bg: #ffffff;
      --border-color: #f1e8dc;
    }

    body {
      background-color: var(--bg-color);
      font-family: 'Poppins', sans-serif;
      color: var(--warm-dark);
    }

    /* Encabezado con estética artesanal y de tienda tradicional */
    .store-header {
      background: linear-gradient(135deg, #8b2612 0%, #d9534f 50%, #f0ad4e 100%);
      color: white;
      padding: 1.5rem 0;
      box-shadow: 0 4px 20px rgba(139, 38, 18, 0.25);
      border-bottom: 5px solid #6b1b0b;
    }

    .store-title {
      font-family: 'Playfair Display', serif;
      font-weight: 700;
      font-size: 2.2rem;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
    }

    .badge-barrio {
      background-color: #fff3cd;
      color: #856404;
      font-weight: 600;
      padding: 0.4rem 0.8rem;
      border-radius: 20px;
      font-size: 0.85rem;
      border: 1px solid #ffeeba;
    }

    /* Tarjetas de Producto */
    .card-product {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      transition: all 0.3s cubic-bezier(0.165, 0.84, 0.44, 1);
      box-shadow: 0 4px 12px rgba(44, 34, 30, 0.04);
      overflow: hidden;
    }

    .card-product:hover {
      transform: translateY(-6px);
      box-shadow: 0 12px 24px rgba(217, 83, 79, 0.15);
      border-color: #e0caaf;
    }

    .card-img-wrapper {
      position: relative;
      background-color: #fff8f0;
      overflow: hidden;
      border-bottom: 1px solid var(--border-color);
    }

    .card-img-top {
      height: 150px;
      object-fit: contain;
      padding: 12px;
      transition: transform 0.3s ease;
    }

    .card-product:hover .card-img-top {
      transform: scale(1.08);
    }

    .badge-tag {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(46, 125, 50, 0.9);
      color: white;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 12px;
      backdrop-filter: blur(4px);
    }

    .price-tag {
      font-size: 1.35rem;
      font-weight: 700;
      color: var(--brand-green);
    }

    /* Buscador elegante */
    .search-box {
      border: 2px solid var(--border-color);
      border-radius: 30px;
      padding: 0.6rem 1.2rem;
      background-color: white;
      transition: all 0.2s ease;
    }

    .search-box:focus-within {
      border-color: var(--primary-color);
      box-shadow: 0 0 0 0.25rem rgba(217, 83, 79, 0.15);
    }

    .search-box input {
      border: none;
      outline: none;
      background: transparent;
    }

    /* Contenedor de la Caja Registradora */
    .caja-card {
      background: #ffffff;
      border-radius: 20px;
      border: 2px solid #f3e9dc;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      overflow: hidden;
    }

    .caja-header {
      background: linear-gradient(135deg, #2c221e 0%, #43322b 100%);
      color: #fff;
      padding: 1.2rem 1.5rem;
    }

    .table-caja th {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #8c7f79;
      background-color: #faf6f0;
      border-bottom: 2px solid var(--border-color);
    }

    .btn-cant {
      width: 28px;
      height: 28px;
      padding: 0;
      line-height: 1;
      border-radius: 50%;
      font-weight: bold;
    }

    /* Panel de Cobro */
    .panel-cobro {
      background-color: #fdf8f2;
      border-radius: 16px;
      border: 1px dashed #e5d7c5;
      padding: 1.25rem;
    }

    .btn-pagar {
      background: linear-gradient(135deg, #2e7d32 0%, #1b5e20 100%);
      color: white;
      border: none;
      border-radius: 12px;
      font-weight: 600;
      padding: 0.8rem;
      box-shadow: 0 4px 12px rgba(46, 125, 50, 0.3);
      transition: all 0.2s ease;
    }

    .btn-pagar:hover {
      background: linear-gradient(135deg, #1b5e20 0%, #0d3b11 100%);
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(46, 125, 50, 0.4);
      color: white;
    }

    /* Paginador personalizado */
    .page-item .page-link {
      color: var(--warm-dark);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      margin: 0 3px;
      font-weight: 500;
    }

    .page-item.active .page-link {
      background-color: var(--primary-color);
      border-color: var(--primary-color);
      color: white;
    }
  </style>
</head>
<body>

  <!-- Encabezado de la Tienda -->
  <header class="store-header mb-4">
    <div class="container">
      <div class="d-flex flex-wrap justify-content-between align-items-center">
        <div>
          <h1 class="store-title m-0"><i class="fa-solid fa-shop me-2"></i>La Tiendita del Barrio</h1>
          <p class="m-0 text-white-50 small"><i class="fa-solid fa-location-dot me-1"></i>Punto de Venta POS & Control de Caja</p>
        </div>
        <div class="mt-2 mt-sm-0">
          <span class="badge-barrio shadow-sm">
            <i class="fa-solid fa-heart me-1 text-danger"></i> Atención Vecinal
          </span>
        </div>
      </div>
    </div>
  </header>

  <div class="container mb-5">
    <div class="row g-4">
      
      <!-- Sección Izquierda: Catálogo de Productos -->
      <div class="col-lg-7">
        
        <div class="d-flex justify-content-between align-items-center mb-3">
          <div>
            <h3 class="fw-bold m-0" style="color: var(--warm-dark);">
              <i class="fa-solid fa-basket-shopping text-danger me-2"></i>Catálogo de Venta
            </h3>
            <span class="text-muted small">Selecciona los productos solicitados por el cliente</span>
          </div>
          <button class="btn btn-sm btn-outline-secondary rounded-pill px-3" onclick="cargarProductos()">
            <i class="fa-solid fa-arrows-rotate me-1"></i> Actualizar
          </button>
        </div>

        <!-- Buscador -->
        <div class="search-box d-flex align-items-center mb-4 shadow-sm">
          <i class="fa-solid fa-magnifying-glass text-muted me-2 fs-5"></i>
          <input type="text" id="inputBuscar" class="w-100" placeholder="Buscar por nombre (ej: Azúcar, Leche, Pepsi)..." oninput="filtrarProductos()">
        </div>

        <!-- Mensaje de Estado / Modo Sync -->
        <div id="statusAlert" class="alert alert-info border-0 rounded-4 shadow-sm d-none mb-3" role="alert"></div>

        <!-- Rejilla de Productos -->
        <div class="row g-3" id="gridProductos">
          <!-- Renderizado dinámico -->
        </div>

        <!-- Control de Paginación -->
        <div class="d-flex justify-content-center mt-4">
          <ul class="pagination" id="paginacion">
            <!-- Paginador dinámico -->
          </ul>
        </div>
      </div>

      <!-- Sección Derecha: Caja de Compra POS -->
      <div class="col-lg-5">
        <div class="caja-card sticky-top" style="top: 20px;">
          
          <div class="caja-header d-flex justify-content-between align-items-center">
            <h4 class="m-0 fw-bold fs-5">
              <i class="fa-solid fa-receipt me-2 text-warning"></i>Cuenta Actual
            </h4>
            <span class="badge bg-warning text-dark font-monospace" id="numItems">0 items</span>
          </div>

          <div class="p-3">
            <!-- Mensaje de Estado de Compra/Alerta -->
            <div id="cajaAlert" class="alert rounded-3 d-none mb-3" role="alert"></div>

            <!-- Tabla de Detalle -->
            <div class="table-responsive mb-3" style="max-height: 260px; overflow-y: auto;">
              <table class="table align-middle table-caja m-0">
                <thead>
                  <tr>
                    <th>Producto</th>
                    <th class="text-center">Cant.</th>
                    <th class="text-end">Subtotal</th>
                    <th class="text-center"></th>
                  </tr>
                </thead>
                <tbody id="bodyCaja">
                  <!-- Filas dinámicas -->
                </tbody>
              </table>
            </div>

            <!-- Resumen de Cobro -->
            <div class="panel-cobro mb-3">
              <div class="d-flex justify-content-between align-items-center mb-3">
                <span class="fw-bold text-muted">TOTAL A COBRAR:</span>
                <span class="h2 m-0 fw-bold text-success font-monospace" id="txtTotal">$0.00</span>
              </div>

              <div class="row g-2 align-items-center pt-2 border-top">
                <div class="col-6">
                  <label for="montoRecibido" class="form-label small fw-bold text-muted mb-1">Efectivo Recibido:</label>
                  <div class="input-group input-group-sm">
                    <span class="input-group-text bg-white">$</span>
                    <input type="number" id="montoRecibido" class="form-control fw-bold" placeholder="0" min="0" oninput="calcularDevuelto()">
                  </div>
                </div>
                <div class="col-6 text-end">
                  <span class="d-block small fw-bold text-muted mb-1">Cambio / Devuelto:</span>
                  <span class="h4 fw-bold font-monospace text-primary m-0" id="txtDevuelto">$0.00</span>
                </div>
              </div>
            </div>

            <!-- Botones principales -->
            <div class="d-grid gap-2">
              <button class="btn btn-pagar btn-lg d-flex align-items-center justify-content-center" onclick="realizarCompra()">
                <i class="fa-solid fa-cash-register me-2 fs-4"></i> Guardar Venta / Registrar
              </button>
              <button class="btn btn-outline-secondary btn-sm border-0 text-muted" onclick="limpiarCaja()">
                <i class="fa-solid fa-rotate-left me-1"></i> Vaciar Registro de Caja
              </button>
            </div>

          </div>
        </div>
      </div>

    </div>
  </div>

  <!-- JavaScript interactivo -->
  <script>
    // Estado General
    let todosLosProductos = [];
    let productosFiltrados = [];
    let caja = [];
    let totalCaja = 0;
    
    // Paginación
    let paginaActual = 1;
    const productosPorPagina = 6;

    // Endpoints API .NET (Desarrollo local)
    const API_URL = 'http://localhost:5231/api/productos';
    const API_COMPRAS_URL = 'http://localhost:5231/api/compras';

    document.addEventListener('DOMContentLoaded', () => {
      cargarProductos();
    });

    async function cargarProductos() {
      const statusAlert = document.getElementById('statusAlert');
      statusAlert.classList.remove('d-none', 'alert-warning', 'alert-danger');
      statusAlert.classList.add('alert-info');
      statusAlert.innerHTML = '<i class="fa-solid fa-spinner fa-spin me-2"></i>Conectando con la base de datos...';

      try {
        const response = await fetch(API_URL);
        if (!response.ok) throw new Error('Servidor no responde.');
        const data = await response.json();
        
        todosLosProductos = data.map(p => ({ 
          ...p, 
          precio: p.precioVenta || p.precio || 0,
          cantidadInput: 1 
        }));
        statusAlert.classList.add('d-none');
      } catch (err) {
        console.warn('API local no disponible. Usando catálogo de respaldo.', err);
        statusAlert.classList.remove('alert-info');
        statusAlert.classList.add('alert-warning');
        statusAlert.innerHTML = '<i class="fa-solid fa-circle-info me-2"></i><strong>Modo Local de Prueba:</strong> Mostrando productos de despensa integrados.';

        todosLosProductos = [
          { id: 1, nombre: 'Azúcar Blanca', descripcion: 'Bolsa x 1 kg', precio: 1000, cantidadInput: 1 },
          { id: 2, nombre: 'Panela Trébol', descripcion: 'Atado de 4 pastillas', precio: 4000, cantidadInput: 1 },
          { id: 3, nombre: 'Gaseosa Pepsi', descripcion: 'Botella 1.5 Litros', precio: 5000, cantidadInput: 1 },
          { id: 4, nombre: 'Aguardiente Amarillo', descripcion: 'Botella 750 ml', precio: 45000, cantidadInput: 1 },
          { id: 5, nombre: 'Leche Alquería', descripcion: 'Bolsa Entera 1L', precio: 4200, cantidadInput: 1 },
          { id: 6, nombre: 'Arroz Roa', descripcion: 'Libra 500g', precio: 2400, cantidadInput: 1 },
          { id: 7, nombre: 'Aceite Vegetal', descripcion: 'Envase 500 ml', precio: 9500, cantidadInput: 1 },
          { id: 8, nombre: 'Café Sello Rojo', descripcion: 'Papeleta 250g', precio: 8800, cantidadInput: 1 }
        ];
      }

      productosFiltrados = [...todosLosProductos];
      renderizarProductos();
    }

    function filtrarProductos() {
      const query = document.getElementById('inputBuscar').value.toLowerCase().trim();
      productosFiltrados = todosLosProductos.filter(p => p.nombre.toLowerCase().includes(query));
      paginaActual = 1;
      renderizarProductos();
    }

    function renderizarProductos() {
      const grid = document.getElementById('gridProductos');
      grid.innerHTML = '';

      if (productosFiltrados.length === 0) {
        grid.innerHTML = `
          <div class="col-12 text-center py-5">
            <i class="fa-solid fa-box-open text-muted fs-1 mb-2 d-block"></i>
            <p class="text-muted">No se encontraron productos coincidentes.</p>
          </div>`;
        document.getElementById('paginacion').innerHTML = '';
        return;
      }

      const inicio = (paginaActual - 1) * productosPorPagina;
      const fin = inicio + productosPorPagina;
      const paginaProductos = productosFiltrados.slice(inicio, fin);

      paginaProductos.forEach(p => {
        const col = document.createElement('div');
        col.className = 'col-sm-6 col-md-4';
        
        col.innerHTML = `
          <div class="card card-product h-100">
            <div class="card-img-wrapper text-center">
              <span class="badge-tag"><i class="fa-solid fa-tag me-1"></i>Disponible</span>
              <img src="https://placehold.co/300x200/fff3e0/d9534f?text=${encodeURIComponent(p.nombre)}" class="card-img-top" alt="${p.nombre}">
            </div>
            <div class="card-body d-flex flex-column justify-content-between p-3">
              <div>
                <h6 class="fw-bold mb-1 text-truncate" title="${p.nombre}">${p.nombre}</h6>
                <p class="text-muted small mb-2 text-truncate">${p.descripcion || 'Producto de tienda'}</p>
                <div class="price-tag mb-3">$${p.precio.toLocaleString()}</div>
              </div>

              <div>
                <div class="input-group input-group-sm mb-2">
                  <span class="input-group-text bg-light">Cant.</span>
                  <input type="number" class="form-control text-center fw-bold" value="${p.cantidadInput}" min="1" onchange="actualizarCantidadTemp(${p.id}, this.value)">
                </div>
                <button class="btn btn-danger btn-sm w-100 fw-semibold rounded-3" onclick="agregarACaja(${p.id})">
                  <i class="fa-solid fa-plus me-1"></i> Agregar a Caja
                </button>
              </div>
            </div>
          </div>
        `;
        grid.appendChild(col);
      });

      renderizarPaginacion();
    }

    function actualizarCantidadTemp(id, valor) {
      const prod = todosLosProductos.find(p => p.id === id);
      if (prod) prod.cantidadInput = Math.max(1, parseInt(valor) || 1);
    }

    function renderizarPaginacion() {
      const totalPaginas = Math.ceil(productosFiltrados.length / productosPorPagina);
      const paginacion = document.getElementById('paginacion');
      paginacion.innerHTML = '';

      if (totalPaginas <= 1) return;

      for (let i = 1; i <= totalPaginas; i++) {
        const li = document.createElement('li');
        li.className = `page-item ${i === paginaActual ? 'active' : ''}`;
        li.innerHTML = `<a class="page-link" href="#" onclick="cambiarPagina(${i}); return false;">${i}</a>`;
        paginacion.appendChild(li);
      }
    }

    function cambiarPagina(nuevaPagina) {
      paginaActual = nuevaPagina;
      renderizarProductos();
    }

    /* Lógica de la Caja Registradora */
    function agregarACaja(idProducto) {
      const producto = todosLosProductos.find(p => p.id === idProducto);
      if (!producto) return;

      const cantidadAdd = producto.cantidadInput || 1;

      const enCaja = caja.find(item => item.id === idProducto);
      if (enCaja) {
        enCaja.cantidad += cantidadAdd;
      } else {
        caja.push({
          id: producto.id,
          nombre: producto.nombre,
          precio: producto.precio,
          cantidad: cantidadAdd
        });
      }

      producto.cantidadInput = 1;
      actualizarCaja();
      renderizarProductos();
    }

    function cambiarCantidadItem(idProducto, delta) {
      const item = caja.find(p => p.id === idProducto);
      if (item) {
        item.cantidad += delta;
        if (item.cantidad <= 0) {
          eliminarDeCaja(idProducto);
        } else {
          actualizarCaja();
        }
      }
    }

    function eliminarDeCaja(idProducto) {
      caja = caja.filter(p => p.id !== idProducto);
      actualizarCaja();
    }

    function limpiarCaja() {
      caja = [];
      document.getElementById('montoRecibido').value = '';
      document.getElementById('txtDevuelto').innerText = '$0.00';
      ocultarAlertaCaja();
      actualizarCaja();
    }

    function actualizarCaja() {
      const bodyCaja = document.getElementById('bodyCaja');
      bodyCaja.innerHTML = '';
      totalCaja = 0;
      let totalItems = 0;

      if (caja.length === 0) {
        bodyCaja.innerHTML = `
          <tr>
            <td colspan="4" class="text-center py-4 text-muted small">
              <i class="fa-solid fa-basket-shopping d-block fs-3 mb-2 opacity-50"></i>
              Sin productos seleccionados
            </td>
          </tr>
        `;
      } else {
        caja.forEach(item => {
          const subtotal = item.precio * item.cantidad;
          totalCaja += subtotal;
          totalItems += item.cantidad;

          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td>
              <div class="fw-bold text-truncate" style="max-width: 130px;">${item.nombre}</div>
              <div class="small text-muted">$${item.precio.toLocaleString()} c/u</div>
            </td>
            <td class="text-center">
              <div class="d-flex align-items-center justify-content-center gap-1">
                <button class="btn btn-sm btn-light border btn-cant" onclick="cambiarCantidadItem(${item.id}, -1)">-</button>
                <span class="fw-bold small px-1">${item.cantidad}</span>
                <button class="btn btn-sm btn-light border btn-cant" onclick="cambiarCantidadItem(${item.id}, 1)">+</button>
              </div>
            </td>
            <td class="text-end fw-bold font-monospace">$${subtotal.toLocaleString()}</td>
            <td class="text-center">
              <button class="btn btn-link text-danger p-0 border-0" onclick="eliminarDeCaja(${item.id})">
                <i class="fa-solid fa-trash-can"></i>
              </button>
            </td>
          `;
          bodyCaja.appendChild(tr);
        });
      }

      document.getElementById('txtTotal').innerText = `$${totalCaja.toLocaleString()}`;
      document.getElementById('numItems').innerText = `${totalItems} items`;
      calcularDevuelto();
    }

    function calcularDevuelto() {
      const montoRecibido = parseFloat(document.getElementById('montoRecibido').value) || 0;
      const txtDevuelto = document.getElementById('txtDevuelto');

      if (montoRecibido >= totalCaja && totalCaja > 0) {
        const devuelto = montoRecibido - totalCaja;
        txtDevuelto.innerText = `$${devuelto.toLocaleString()}`;
        txtDevuelto.className = 'h4 fw-bold font-monospace text-primary m-0';
        ocultarAlertaCaja();
      } else if (montoRecibido > 0 && montoRecibido < totalCaja) {
        txtDevuelto.innerText = '$0.00';
        mostrarAlertaCaja('El pago recibido es insuficiente.', 'alert-warning');
      } else {
        txtDevuelto.innerText = '$0.00';
        txtDevuelto.className = 'h4 fw-bold font-monospace text-muted m-0';
        ocultarAlertaCaja();
      }
    }

    async function realizarCompra() {
      if (caja.length === 0) {
        mostrarAlertaCaja('Agregue productos antes de realizar la venta.', 'alert-warning');
        return;
      }

      const compraRequest = {
        Productos: caja.map(item => ({
          Id: item.id,
          PrecioVenta: item.precio,
          Cantidad: item.cantidad
        })),
        Total: totalCaja
      };

      try {
        const response = await fetch(API_COMPRAS_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(compraRequest)
        });

        if (response.ok) {
          mostrarAlertaCaja('¡Venta registrada exitosamente en el servidor!', 'alert-success');
          setTimeout(() => limpiarCaja(), 1800);
        } else {
          throw new Error('Respuesta de servidor no OK');
        }
      } catch (error) {
        console.warn('Simulando guardado local...', error);
        mostrarAlertaCaja('¡Venta realizada con éxito! (Guardado local comprobado)', 'alert-success');
        setTimeout(() => limpiarCaja(), 1800);
      }
    }

    function mostrarAlertaCaja(mensaje, tipo) {
      const alert = document.getElementById('cajaAlert');
      alert.className = `alert ${tipo} small p-2 mb-2 text-center fw-semibold`;
      alert.innerText = mensaje;
      alert.classList.remove('d-none');
    }

    function ocultarAlertaCaja() {
      document.getElementById('cajaAlert').classList.add('d-none');
    }
  </script>
</body>
</html>
