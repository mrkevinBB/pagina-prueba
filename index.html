<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Página Interactiva</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1a202c;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: #2d3748;
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 400px;
        }
        h1 {
            color: #48bb78;
            margin-bottom: 0.5rem;
        }
        .btn {
            background-color: #3182ce;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 15px;
            transition: background-color 0.2s ease;
        }
        .btn:hover {
            background-color: #2b6cb0;
        }
        #mensaje {
            margin-top: 20px;
            font-weight: bold;
            color: #ecc94b;
            min-height: 24px; /* Para mantener el espacio antes de hacer clic */
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>¡Prueba Exitosa! 🚀</h1>
        <p>Esta página fue desplegada usando GitHub Pages.</p>

        <!-- Botón interactivo -->
        <button class="btn" onclick="mostrarMensaje()">Haz clic aquí</button>

        <!-- Párrafo donde aparecerá el mensaje -->
        <p id="mensaje"></p>
    </div>

    <script>
        // Función que se ejecuta al presionar el botón
        function mostrarMensaje() {
            const contenedorMensaje = document.getElementById("mensaje");
            contenedorMensaje.innerText = "¡Hola! El botón funciona correctamente 🎉";
        }
    </script>
</body>
</html>
